# Build dbxl and run the whole test suite: the unit tests (make test) and
# the visual tests (make visual), which drive dbxl on a private Xvfb under
# GDB and compare its windows with the xldb references pixel for pixel.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The same distribution the references were checked on: the programs'
    # uninitialised locals (compared with xldb's zeroed stack) depend on
    # the C library's start-up code.  GDB needs ptrace and personality()
    # (no address randomisation), which Docker's default profile blocks.
    container:
      image: ubuntu:26.04
      options: --security-opt seccomp=unconfined --cap-add=SYS_PTRACE
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          # build: Xlib and XRender; tests: GDB with Python, Xvfb, the
          # 8x13 core font (xfonts-base), xwininfo, Pillow, python-xlib
          apt-get install -y --no-install-recommends \
            build-essential pkg-config libx11-dev libxrender-dev \
            gdb xvfb xfonts-base x11-utils python3 python3-pil python3-xlib

      - name: Show tool versions
        run: |
          cc --version | head -1
          gdb --version | head -1
          python3 -c 'import PIL, Xlib; print("Pillow", PIL.__version__)'

      - name: Build
        run: make

      - name: Unit tests
        run: make test

      - name: Visual tests
        run: make visual

      - name: Keep the visual test output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-output
          path: build/visual/
          retention-days: 14
